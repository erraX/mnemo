# 云端采集 Worker 的部署配置
#
# 首次部署：
#   npx wrangler@4 login
#   npx wrangler@4 d1 create mnemo            # 把返回的 database_id 填到下面
#   npx wrangler@4 d1 execute mnemo --remote --config worker/wrangler.toml --file=worker/schema.sql
#   npx wrangler@4 secret put TOKEN --config worker/wrangler.toml   # 粘贴长随机串（openssl rand -hex 32）
#   pnpm worker:deploy
#
# 之后推 main 由 .github/workflows/worker.yml 自动部署；
# 它需要仓库 secret：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、MNEMO_CLOUD_TOKEN。

name = "mnemo-cloud"
main = "index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "mnemo"
# 填 d1 create 输出的 id；本地开发可用 --local 走 .wrangler 里的临时库
database_id = "5f704c3e-4909-442b-8f6c-dfe1bacf195c"

[observability]
enabled = true
