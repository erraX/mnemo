name: Deploy cloud worker

# 只在 Worker 相关文件变更时部署，避免每次前端提交都碰一次 Cloudflare。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Deploy
        working-directory: worker
        # TOKEN 用仓库 secret 覆盖：wrangler secret put 是一次性的，CI 里每次部署都要带
        run: npx wrangler@4 deploy --var TOKEN:${{ secrets.MNEMO_CLOUD_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
